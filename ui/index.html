<!DOCTYPE html>
<html lang="ko" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <title>AgSnapTool</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header>
      <div class="title">
        <strong id="product">AgSnapTool</strong>
        <span id="hint"></span>
      </div>
      <label>
        <select id="day"></select>
      </label>
      <button id="folder" type="button"></button>
      <button id="log" type="button"></button>
    </header>
    <div class="body">
      <main id="scroller">
        <div id="board"></div>
      </main>
      <aside id="panel">
        <button id="panel-toggle" type="button"></button>
        <div id="panel-body">
        <h2 id="shortcut-label"></h2>
        <label><input id="control" type="checkbox" /> Ctrl</label>
        <label><input id="shift" type="checkbox" /> Shift</label>
        <label><input id="alt" type="checkbox" /> Alt</label>
        <p id="shortcut-error"></p>
        <h2 id="retention-label"></h2>
        <label>
          <span id="days-label"></span>
          <input id="days" type="number" min="1" max="3650" />
        </label>
        <h2 id="language-label"></h2>
        <select id="language">
          <option value=""></option>
          <option value="ko"></option>
          <option value="en"></option>
        </select>
        <h2 id="theme-label"></h2>
        <select id="theme">
          <option value=""></option>
          <option value="dark"></option>
          <option value="light"></option>
        </select>
        <h2 id="tilt-label"></h2>
        <label>
          <input id="tilt" type="number" min="0" max="15" />
        </label>
        <label>
          <input id="tape" type="checkbox" />
          <span id="tape-label"></span>
        </label>
        <button id="history-open" type="button"></button>
        </div>
      </aside>
    </div>
    <div id="menu" hidden>
      <button id="menu-copy" type="button"></button>
      <button id="menu-lens" type="button"></button>
    </div>
    <div id="lens" hidden>
      <img id="lens-image" alt="" />
    </div>
    <div id="history" hidden>
      <div class="dialog">
        <div class="dialog-bar">
          <strong id="history-title"></strong>
          <button id="history-close" type="button"></button>
        </div>
        <pre id="changelog"></pre>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
