<!DOCTYPE html>
<html lang="ko" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <title>AgSnapTool</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header>
      <div class="title">
        <strong id="product">AgSnapTool</strong>
        <span id="hint"></span>
      </div>
      <label>
        <select id="day"></select>
      </label>
      <button id="folder" type="button"></button>
      <button id="log" type="button"></button>
    </header>
    <div class="body">
      <main id="scroller">
        <div id="board"></div>
      </main>
      <aside id="panel">
        <button id="panel-toggle" type="button"></button>
        <div id="panel-body">
          <section class="pane-group">
            <h2 id="shortcut-label"></h2>
            <div class="pane-card">
              <label class="pane-row">
                <span>Ctrl</span>
                <span class="switch">
                  <input id="control" type="checkbox" />
                </span>
              </label>
              <label class="pane-row">
                <span>Shift</span>
                <span class="switch">
                  <input id="shift" type="checkbox" />
                </span>
              </label>
              <label class="pane-row">
                <span>Alt</span>
                <span class="switch">
                  <input id="alt" type="checkbox" />
                </span>
              </label>
            </div>
            <p id="shortcut-error"></p>
          </section>
          <section class="pane-group">
            <h2 id="retention-label"></h2>
            <div class="pane-card">
              <label class="pane-row">
                <span id="days-label"></span>
                <input id="days" type="number" min="1" max="3650" />
              </label>
            </div>
          </section>
          <section class="pane-group">
            <h2 id="language-label"></h2>
            <div class="pane-card">
              <label class="pane-row">
                <select id="language">
                  <option value=""></option>
                  <option value="ko"></option>
                  <option value="en"></option>
                </select>
              </label>
            </div>
          </section>
          <section class="pane-group">
            <h2 id="theme-label"></h2>
            <div class="pane-card">
              <label class="pane-row">
                <select id="theme">
                  <option value=""></option>
                  <option value="dark"></option>
                  <option value="light"></option>
                  <option value="flat"></option>
                  <option value="material"></option>
                  <option value="fluent"></option>
                  <option value="glass"></option>
                </select>
              </label>
            </div>
          </section>
          <section class="pane-group" id="polaroid-box">
            <div class="pane-card">
              <label class="pane-row">
                <span id="polaroid-label"></span>
                <span class="switch">
                  <input id="polaroid" type="checkbox" />
                </span>
              </label>
              <div id="polaroid-options">
                <label class="pane-row">
                  <span id="tilt-label"></span>
                  <input id="tilt" type="number" min="0" max="15" />
                </label>
                <label class="pane-row">
                  <span id="tape-label"></span>
                  <span class="switch">
                    <input id="tape" type="checkbox" />
                  </span>
                </label>
                <label class="pane-row">
                  <span id="tape-width-label"></span>
                  <input id="tape-width" type="number" min="24" max="120" />
                </label>
                <label class="pane-row">
                  <span id="tape-height-label"></span>
                  <input id="tape-height" type="number" min="8" max="48" />
                </label>
              </div>
            </div>
          </section>
          <button id="history-open" type="button"></button>
        </div>
      </aside>
    </div>
    <div id="menu" hidden>
      <button id="menu-copy" type="button"></button>
      <button id="menu-lens" type="button"></button>
      <button id="menu-open" type="button"></button>
    </div>
    <div id="lens" hidden>
      <img id="lens-image" alt="" />
    </div>
    <div id="history" hidden>
      <div class="dialog">
        <div class="dialog-bar">
          <strong id="history-title"></strong>
          <button id="history-close" type="button"></button>
        </div>
        <pre id="changelog"></pre>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
