<!DOCTYPE html>
<html lang="ko" data-theme="system" data-mode="gallery">
  <head>
    <meta charset="utf-8" />
    <title>AgSnapTool</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header>
      <div class="title">
        <strong id="product">AgSnapTool</strong>
        <span id="hint"></span>
      </div>
      <label>
        <select id="day"></select>
      </label>
      <button id="folder" type="button"></button>
      <button id="log" type="button"></button>
    </header>
    <div class="body">
      <main id="scroller">
        <div id="board"></div>
      </main>
      <aside id="panel">
        <button id="panel-toggle" type="button"></button>
        <div id="panel-body">
          <section class="pane-group">
            <h2 id="shortcut-label"></h2>
            <div class="pane-card">
              <label class="pane-row">
                <span>Ctrl</span>
                <span class="switch">
                  <input id="control" type="checkbox" />
                </span>
              </label>
              <label class="pane-row">
                <span>Shift</span>
                <span class="switch">
                  <input id="shift" type="checkbox" />
                </span>
              </label>
              <label class="pane-row">
                <span>Alt</span>
                <span class="switch">
                  <input id="alt" type="checkbox" />
                </span>
              </label>
            </div>
            <p id="shortcut-error"></p>
          </section>
          <section class="pane-group">
            <h2 id="retention-label"></h2>
            <div class="pane-card">
              <label class="pane-row">
                <span id="days-label"></span>
                <input id="days" type="number" min="1" max="3650" />
              </label>
            </div>
          </section>
          <section class="pane-group">
            <h2 id="language-label"></h2>
            <div class="pane-card">
              <label class="pane-row">
                <select id="language">
                  <option value=""></option>
                  <option value="ko"></option>
                  <option value="en"></option>
                </select>
              </label>
            </div>
          </section>
          <section class="pane-group">
            <h2 id="theme-label"></h2>
            <div class="pane-card">
              <label class="pane-row">
                <select id="theme">
                  <option value=""></option>
                  <option value="dark"></option>
                  <option value="light"></option>
                  <option value="flat"></option>
                  <option value="material"></option>
                  <option value="glass"></option>
                </select>
              </label>
            </div>
          </section>
          <section class="pane-group" id="polaroid-box">
            <div class="pane-card">
              <label class="pane-row">
                <span id="polaroid-label"></span>
                <span class="switch">
                  <input id="polaroid" type="checkbox" />
                </span>
              </label>
              <div id="polaroid-options">
                <label class="pane-row">
                  <span id="tilt-label"></span>
                  <input id="tilt" type="number" min="0" max="15" />
                </label>
                <label class="pane-row">
                  <span id="tape-label"></span>
                  <span class="switch">
                    <input id="tape" type="checkbox" />
                  </span>
                </label>
                <label class="pane-row">
                  <span id="tape-width-label"></span>
                  <input id="tape-width" type="number" min="24" max="120" />
                </label>
                <label class="pane-row">
                  <span id="tape-height-label"></span>
                  <input id="tape-height" type="number" min="8" max="48" />
                </label>
              </div>
            </div>
          </section>
          <button id="history-open" type="button"></button>
        </div>
      </aside>
    </div>
    <div id="menu" hidden>
      <button id="menu-copy" type="button"></button>
      <button id="menu-lens" type="button"></button>
      <button id="menu-edit" type="button"></button>
      <button id="menu-delete" type="button"></button>
      <button id="menu-open" type="button"></button>
    </div>
    <div id="lens" hidden>
      <img id="lens-image" alt="" />
    </div>
    <div id="editor" hidden>
      <div class="editor-bar">
        <div class="editor-cluster editor-tools" role="toolbar">
          <button id="edit-select" type="button" data-tool="select">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M4 2.8 15 11.2l-4.6 1.1L13 17.6l-2.1.7-2.5-5.2L4 15.2z" />
            </svg>
          </button>
          <button id="edit-rect" type="button" data-tool="rect">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <rect x="3.5" y="5" width="13" height="10" rx="1.5" />
            </svg>
          </button>
          <button id="edit-ellipse" type="button" data-tool="ellipse">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <ellipse cx="10" cy="10" rx="7" ry="5" />
            </svg>
          </button>
          <button id="edit-polygon" type="button" data-tool="polygon">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <polygon points="10,3 17,8.2 14.6,16.5 5.4,16.5 3,8.2" />
            </svg>
          </button>
          <button id="edit-arrow" type="button" data-tool="arrow">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M4 16 14.2 5.8" />
              <path d="M8.2 5.4h6.4V11.8" />
            </svg>
          </button>
          <button id="edit-text" type="button" data-tool="text">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M5 5.2h10M10 5.2V16" />
            </svg>
          </button>
        </div>
        <div class="editor-cluster" data-inspect="ink">
          <label>
            <input id="edit-stroke-on" type="checkbox" checked />
            <span id="edit-stroke-label"></span>
            <input id="edit-stroke" type="color" value="#ff3b30" />
          </label>
          <label>
            <input id="edit-fill-on" type="checkbox" />
            <span id="edit-fill-label"></span>
            <input id="edit-fill" type="color" value="#ffd60a" />
          </label>
          <label>
            <span id="edit-width-label"></span>
            <input id="edit-width" type="number" min="1" max="32" value="3" />
          </label>
        </div>
        <div class="editor-cluster" data-inspect="box">
          <label>
            <span id="edit-size-label"></span>
            <input id="edit-box-w" type="number" min="4" max="8000" />
            <input id="edit-box-h" type="number" min="4" max="8000" />
          </label>
        </div>
        <div class="editor-cluster" data-inspect="arrow">
          <label>
            <span id="edit-head-label"></span>
            <select id="edit-head">
              <option value="triangle"></option>
              <option value="chevron"></option>
              <option value="barbed"></option>
            </select>
          </label>
          <label>
            <span id="edit-head-size-label"></span>
            <input
              id="edit-head-size"
              type="number"
              min="8"
              max="64"
              value="18"
            />
          </label>
        </div>
        <div class="editor-cluster" data-inspect="type">
          <label>
            <span id="edit-font-label"></span>
            <select id="edit-font">
              <option value="Malgun Gothic">Malgun Gothic</option>
              <option value="Segoe UI">Segoe UI</option>
              <option value="Arial">Arial</option>
              <option value="Consolas">Consolas</option>
            </select>
          </label>
          <label>
            <span id="edit-font-size-label"></span>
            <input
              id="edit-font-size"
              type="number"
              min="10"
              max="96"
              value="22"
            />
          </label>
          <label>
            <span id="edit-color-label"></span>
            <input id="edit-color" type="color" value="#1a1c1f" />
          </label>
        </div>
        <div class="editor-cluster editor-actions">
          <button id="edit-save" type="button"></button>
          <button id="edit-cancel" type="button"></button>
        </div>
      </div>
      <p id="edit-hint"></p>
      <p id="edit-error"></p>
      <div class="editor-stage">
        <canvas id="edit-canvas"></canvas>
        <textarea id="edit-text-input" hidden></textarea>
      </div>
    </div>
    <div id="editor-ask" hidden>
      <div class="dialog editor-ask-box">
        <p id="editor-ask-text"></p>
        <div class="editor-ask-actions">
          <button id="editor-ask-save" type="button"></button>
          <button id="editor-ask-discard" type="button"></button>
          <button id="editor-ask-cancel" type="button"></button>
        </div>
      </div>
    </div>
    <div id="history" hidden>
      <div class="dialog">
        <div class="dialog-bar">
          <strong id="history-title"></strong>
          <button id="history-close" type="button"></button>
        </div>
        <pre id="changelog"></pre>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
